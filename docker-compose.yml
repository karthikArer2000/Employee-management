
services:
  backend:
    build:
      context: ./server
    image: karthikarer1999/employee-backend:latest
    ports:
      - "5050:5050"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5050
    image: karthikarer1999/employee-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
